# Seamless joins use the preceding color as foreground and the following
# color as background, as in Starship's official Pastel Powerline preset:
# https://starship.rs/presets/pastel-powerline.html
# Each optional segment owns its incoming separator, preventing stray
# colors when it disappears. Without a following Git segment, the directory
# or branch ends with a flat edge. The blue status segment ends in an arrow.
# Git status: $ stash, ! modified, + staged, ? untracked, x deleted,
# > renamed, = conflicts, arrows ahead/behind the upstream branch.
# Node.js appears only in detected Node projects, using your installed version.
# VS Code's command-status circles and shell syntax highlighting are separate
# features; they are not generated by this Starship configuration.

"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = 'screenshot'
format = '$directory${custom.directory_arrow}$git_branch$git_status$git_state$nodejs$line_break$character'

[palettes.screenshot]
coral = '#D86671'
yellow = '#FFF09B'
blue = '#32A0EF'
green = '#44B273'
ink = '#1E2530'
text = '#C5CDD9'

[directory]
style = 'fg:ink bg:coral'
format = '[](fg:coral)[ $path( $read_only) ]($style)'
truncation_length = 1
truncate_to_repo = false
read_only = ' '
read_only_style = 'fg:ink bg:coral'

[git_branch]
symbol = ''
style = 'fg:ink bg:yellow'
format = '[](fg:coral bg:yellow)[ $symbol $branch ]($style)'
truncation_length = 28
truncation_symbol = '…'

[git_status]
style = 'fg:ink bg:blue'
format = '([](fg:yellow bg:blue)[ $all_status$ahead_behind ]($style)[](fg:blue))'
conflicted = '='
stashed = '\$'
modified = '!'
staged = '+'
untracked = '?'
renamed = '>'
deleted = 'x'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'

[git_state]
style = 'bold fg:yellow'
format = ' [\($state( $progress_current/$progress_total)\)]($style)'

[nodejs]
symbol = ' '
style = 'bold fg:green'
format = ' [via](fg:text) [$symbol$version]($style)'

[line_break]
disabled = false

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:coral)'
vimcmd_symbol = '[❮](bold fg:green)'

[custom.directory_arrow]
when = '! git rev-parse --git-dir >/dev/null 2>&1'
shell = ['sh']
symbol = ''
format = '[$symbol](fg:coral)'

[package]
symbol = " "

[battery]
disabled = true
